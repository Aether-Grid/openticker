# Single-indicator bot template.

id = "equities-basket-single-indicator-paper"
enabled = true

# Required for bots bound to live accounts when explicit live opt-in is enabled globally.
# Schema default: false
allow_live = false

market = "equities"
symbols = ["AAPL", "MSFT", "COIN", "PLTR", "TSLA", "CCL", "CZR"]
# Each symbol runs as an independent runtime lane under this bot.
timeframe = "1m"
account = "alpaca-paper"
data_connector = "alpaca"
execution_connector = "alpaca"
strategy = "single_indicator_signal"

# Allowed values: "intrabar", "confirmed_only"
# This template defaults to confirmed bar-close trading.
# For intrabar preview trading on supported paper connectors, set:
# - signal_mode = "intrabar"
# - indicator signal_policy = "preview_allowed" (or omit policy to inherit intrabar default)
signal_mode = "confirmed_only"

# Schema default: true
polling_enabled = true
# Schema default: 1000
polling_interval_ms = 1000

# Optional warmup override. If set, it must be at least the maximum minimum warmup required by
# the enabled indicators on this bot.
# warmup_target_bars = 200

[[indicators]]
id = "primary-1"
type = "sma_crossover"

# Schema default: true
enabled = true

# Optional. When omitted, the indicator manifest default role is used.
role = "primary_signal"

# Optional. When omitted, runtime defaults follow `signal_mode`.
# - confirmed_only -> confirmed_required
# - intrabar -> preview_allowed
signal_policy = "confirmed_required"

# Only valid when `strategy = "consensus"`.
# weight = 1.0

# Optional metadata-aware trade gating.
[indicators.metadata_filters.entry]
# allowed_strengths = ["strong"]
# allowed_reason_codes = ["sma_cross_up"]
# required_tags_all = ["bullish"]
# required_tags_any = ["trend", "bullish"]
# blocked_tags = ["hidden"]

[indicators.metadata_filters.exit]
# allowed_strengths = ["normal", "strong"]
# allowed_reason_codes = ["sma_cross_down"]
# required_tags_all = ["bearish"]
# required_tags_any = ["trend", "bearish"]
# blocked_tags = ["hidden"]

[indicators.params]
# Runtime-recognized params depend on indicator type.
#
# sma_crossover:
fast_length = 10
slow_length = 30
#
# rsi_threshold:
# period = 14
# oversold = 30.0
# overbought = 70.0

[budget]
# Shared across all lanes for this bot.
pct = 12.5

[risk]
profile = "equities-default"

[risk.overrides]

stale_data_ms = 30000
# max_daily_loss_pct = 2.0
# max_open_positions = 10
# target_order_notional_usd = 2000.0
# max_order_notional_usd = 2500.0
# max_spread_bps = 20
# max_slippage_bps = 30
# cooldown_after_reject_ms = 15000

[execution_constraints]
# quantity_step = 1.0
# min_quantity = 1.0
# min_notional_usd = 10.0
