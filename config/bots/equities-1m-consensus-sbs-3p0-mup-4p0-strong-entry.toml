# Tuned equities 1m consensus bot: wider SBS bands + strong-only SBS entries.
id = "equities-1m-consensus-sbs-3p0-mup-4p0-strong-entry"
enabled = false
allow_live = false
market = "equities"
symbols = ["AAPL", "MSFT", "COIN", "PLTR", "TSLA"]
timeframe = "1m"
account = "alpaca-paper"
data_connector = "alpaca"
execution_connector = "alpaca"
strategy = "consensus"
signal_mode = "confirmed_only"
polling_enabled = true
polling_interval_ms = 10000

[[indicators]]
id = "sbs-1"
type = "strong_buy_strong_sell"
enabled = true
role = "primary_signal"
signal_policy = "confirmed_required"
weight = 1.0
params = { sensitivity = 3.0 }

[indicators.metadata_filters.entry]
allowed_strengths = ["strong"]

[[indicators]]
id = "mup-1"
type = "momentum_ultima_plus"
enabled = true
role = "primary_signal"
signal_policy = "confirmed_required"
weight = 1.0
params = { sensitivity = 4.0 }

[budget]
pct = 10.0

[risk]
profile = "equities-default"

[risk.overrides]
target_order_notional_usd = 200.0
