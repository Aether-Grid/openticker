# Canonical equities experiment bot for AAPL and MSFT.
id = "equities-30m-single-mup-sens-4p0"
enabled = true
allow_live = false
market = "equities"
symbols = ["AAPL", "MSFT", "COIN", "PLTR", "TSLA"]
timeframe = "30m"
account = "alpaca-paper"
data_connector = "alpaca"
execution_connector = "alpaca"
strategy = "single_indicator_signal"
signal_mode = "confirmed_only"
polling_enabled = true
polling_interval_ms = 120000

[[indicators]]
id = "mup-1"
type = "momentum_ultima_plus"
enabled = true
role = "primary_signal"
signal_policy = "confirmed_required"

[indicators.params]
sensitivity = 4.0

[budget]
pct = 10.0

[risk]
profile = "equities-default"

[risk.overrides]
target_order_notional_usd = 200.0