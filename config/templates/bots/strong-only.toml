# Strong-only directional bot template.
#
# This template enables metadata-based entry filtering immediately. It will only open/add
# positions when the indicator emits `strength = "strong"`. Exit filtering remains permissive.

id = "equities-basket-strong-only-paper"
enabled = true
allow_live = false
market = "equities"
symbols = ["AAPL", "MSFT", "COIN", "PLTR", "TSLA", "CCL", "CZR"]
# Each symbol runs as an independent runtime lane under this bot.
timeframe = "5m"
account = "alpaca-paper"
data_connector = "alpaca"
execution_connector = "alpaca"
strategy = "single_indicator_signal"
signal_mode = "confirmed_only"
polling_enabled = true
polling_interval_ms = 1500

[[indicators]]
id = "trend-1"
type = "sma_crossover"
enabled = true
role = "primary_signal"
signal_policy = "confirmed_required"

[indicators.metadata_filters.entry]
allowed_strengths = ["strong"]

[indicators.metadata_filters.exit]
allowed_strengths = ["normal", "strong"]

[indicators.params]
fast_length = 10
slow_length = 30

[budget]
# Shared across all lanes for this bot.
pct = 12.5

[risk]
profile = "equities-default"

[risk.overrides]

stale_data_ms = 30000
# max_order_notional_usd = 1600.0

[execution_constraints]
# quantity_step = 1.0
# min_quantity = 1.0
