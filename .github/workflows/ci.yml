name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Run CI checks
        run: make ci
