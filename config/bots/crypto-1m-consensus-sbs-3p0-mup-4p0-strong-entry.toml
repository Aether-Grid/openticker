# Tuned crypto 1m consensus bot: wider SBS bands + strong-only SBS entries.
id = "crypto-1m-consensus-sbs-3p0-mup-4p0-strong-entry"
enabled = false
allow_live = false
market = "crypto"
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "DOGEUSDT", "PEPEUSDT"]
timeframe = "1m"
account = "binance-demo"
data_connector = "binance"
execution_connector = "binance"
strategy = "consensus"
signal_mode = "intrabar"
polling_enabled = true
polling_interval_ms = 1000

[[indicators]]
id = "sbs-1"
type = "strong_buy_strong_sell"
enabled = true
role = "primary_signal"
signal_policy = "preview_allowed"
weight = 1.0
params = { sensitivity = 3.0 }

[indicators.metadata_filters.entry]
allowed_strengths = ["strong"]

[[indicators]]
id = "mup-1"
type = "momentum_ultima_plus"
enabled = true
role = "primary_signal"
signal_policy = "preview_allowed"
weight = 1.0
params = { sensitivity = 4.0 }

[budget]
pct = 10.0

[risk]
profile = "crypto-default"

[risk.overrides]
target_order_notional_usd = 200.0
