[workspace]
members = [
    "crates/openticker-core",
    "crates/openticker-config",
    "crates/openticker-registry",
    "crates/openticker-indicators",
    "crates/openticker-instance",
    "crates/openticker-signals",
    "crates/openticker-strategy",
    "crates/openticker-risk",
    "crates/openticker-data",
    "crates/openticker-dataplane",
    "crates/openticker-execution",
    "crates/openticker-gateway",
    "crates/openticker-ledger",
    "crates/openticker-portfolio",
    "crates/openticker-storage",
    "crates/openticker-trace",
    "crates/openticker-connectors",
    "crates/openticker-lane",
    "crates/openticker-runtime",
    "crates/openticker-http",
    "crates/openticker-cli",
    "crates/openticker-testkit",
]
default-members = ["crates/openticker-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/OpenTicker/openticker"
homepage = "https://github.com/OpenTicker/openticker"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.50", features = ["derive"] }
crossterm = "0.29.0"
dotenvy = "0.15.7"
ratatui = "0.29.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "sync"] }
toml = "0.8.23"
toml_edit = "0.22"
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
