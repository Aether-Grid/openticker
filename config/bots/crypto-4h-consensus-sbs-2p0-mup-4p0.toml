# Canonical crypto experiment bot for BTCUSDT and ETHUSDT.
id = "crypto-4h-consensus-sbs-2p0-mup-4p0"
enabled = true
allow_live = false
market = "crypto"
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "DOGEUSDT", "PEPEUSDT"]
timeframe = "4h"
account = "binance-demo"
data_connector = "binance"
execution_connector = "binance"
strategy = "consensus"
signal_mode = "intrabar"
polling_enabled = true
polling_interval_ms = 1000

[[indicators]]
id = "sbs-1"
type = "strong_buy_strong_sell"
enabled = true
role = "primary_signal"
signal_policy = "preview_allowed"
weight = 1.0
params = { sensitivity = 2.0 }

[[indicators]]
id = "mup-1"
type = "momentum_ultima_plus"
enabled = true
role = "primary_signal"
signal_policy = "preview_allowed"
weight = 1.0
params = { sensitivity = 4.0 }

[budget]
pct = 10.0

[risk]
profile = "crypto-default"

[risk.overrides]
target_order_notional_usd = 200.0
